<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 43 Practice Quiz 3</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        [data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }

        [data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }

        [data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }

        [data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }

        [data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 43 Practice Quiz 3</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button in Header -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>

                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Male Reproductive Disorders ---
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO1: Explain male sex differentiation to a testis—SRY, AMH, & the steroid pathway leading to androgens.",
                question: "A 16-year-old phenotypic female presents for evaluation of primary amenorrhea. Physical examination reveals an absence of secondary sexual characteristics, and an ultrasound shows a completely absent uterus and vagina, along with bilateral streak gonads. Karyotype analysis reveals a 46, XY chromosomal pattern. A null mutation in which of the following genes is the most likely cause of this patient's complete failure of testicular differentiation?",
                options: {
                    A: "AR (Androgen Receptor)",
                    B: "FOXL2",
                    C: "SRY",
                    D: "StAR",
                    E: "WNT4"
                },
                correctAnswer: "C",
                rationale: "In a 46, XY individual, the SRY gene is required to initiate testicular development (by upregulating SOX9). A mutation in the SRY gene results in gonadal failure with streak gonads, preventing male differentiation (Swyer syndrome).",
                source: "Male Reproductive Disorders PDF, slide 5: '-Human pathogenic variants: SRY: gonadal failure with streaks (Swyer syndrome = 46,XY DSD)'"
            },
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO1: Explain male sex differentiation to a testis—SRY, AMH, & the steroid pathway leading to androgens.",
                question: "A newborn infant with a 46, XY karyotype is found to have ambiguous external genitalia. Further evaluation reveals perfectly normal internal male reproductive ducts (vas deferens, epididymis, seminal vesicles) but severely undermasculinized external genitalia (urogenital sinus, prostate, genital tubercle). This specific pattern of development strongly suggests an enzymatic defect in the conversion of testosterone to which of the following hormones?",
                options: {
                    A: "Aldosterone",
                    B: "Androstenedione",
                    C: "Dihydrotestosterone (DHT)",
                    D: "Estradiol",
                    E: "Pregnenolone"
                },
                correctAnswer: "C",
                rationale: "In male sexual differentiation, testosterone (secreted by Leydig cells) directly drives the differentiation of the internal Wolffian ducts. However, the differentiation of the external genitalia requires testosterone to be converted into the more potent Dihydrotestosterone (DHT) by the enzyme 5-alpha-reductase. A defect in this conversion pathway leads to normal internal ducts but abnormal external genitalia.",
                source: "Male Reproductive Disorders PDF, slide 6: 'Male Sexual Differentiation... 2. Testosterone (8 wk) (Leydig cells) -> + Wolffian (Internal) 1. vas 2. epididymis 3. seminal vesicle... 5a-reductase -> DHT -> External genitalia 1. urogenital sinus 2. prostate 3. genital tubercle'"
            },
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO2: Explain the locations & functions of Sertoli cells and Leydig cells.",
                question: "A 28-year-old man undergoes a fertility evaluation. Semen analysis shows azoospermia, but circulating testosterone levels are completely normal. A testicular biopsy reveals an absence of the cells that normally secrete androgen-binding protein (ABP) into the luminal fluid. The missing cells are normally located in which of the following areas?",
                options: {
                    A: "Anterior pituitary",
                    B: "Bulbourethral gland",
                    C: "Interstitial stroma",
                    D: "Prostate gland",
                    E: "Seminiferous tubule"
                },
                correctAnswer: "E",
                rationale: "Sertoli cells are located within the seminiferous tubules. Their functions include secreting luminal fluid containing androgen-binding protein (ABP), forming the blood-testis barrier, and nourishing developing sperm. Leydig cells, which produce testosterone, are located in the interstitial stroma outside the tubules.",
                source: "Male Reproductive Disorders PDF, slides 8 & 19: 'Interstitial cells of Leydig... [Image pointing to Interstitial cells outside the tubule]... [Image pointing to Seminiferous tubule]' AND 'Sertoli Cell Functions... 2. Secrete luminal fluid, including androgen-binding protein (ABP)'"
            },
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO2: Explain the locations & functions of Sertoli cells and Leydig cells.",
                question: "During fetal development, a male fetus begins producing the testosterone required for normal male internal duct differentiation around 8 weeks of gestation. At this specific developmental stage, before the fetal pituitary is fully mature, which of the following hormones directly stimulates the Leydig cells to produce this essential testosterone?",
                options: {
                    A: "Anti-Mullerian Hormone (AMH)",
                    B: "Follicle-Stimulating Hormone (FSH)",
                    C: "Gonadotropin-Releasing Hormone (GnRH)",
                    D: "Human Chorionic Gonadotropin (hCG)",
                    E: "Luteinizing Hormone (LH)"
                },
                correctAnswer: "D",
                rationale: "Leydig cells are responsible for producing testosterone. During fetal development, before the onset of endogenous pubertal LH surges, Leydig cells are stimulated by placental hCG to produce the testosterone necessary to ensure normal male differentiation.",
                source: "Male Reproductive Disorders PDF, slide 9: 'Leydig Cell Functions 1. During fetal development, they respond to hCG & produce testosterone to ensure normal male development'"
            },
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO3: Diagram the hypothalamic-pituitary-testicular axis.",
                question: "A 35-year-old male bodybuilder illegally uses high doses of synthetic testosterone to increase his muscle mass. Over time, this exogenous steroid profoundly suppresses his hypothalamic-pituitary-testicular axis. Which of the following accurately describes the primary feedback effect of this exogenous testosterone?",
                options: {
                    A: "It inhibits AMH secretion from the testis.",
                    B: "It inhibits FSH secretion directly from the Sertoli cells.",
                    C: "It inhibits LH predominantly at the hypothalamus and pituitary.",
                    D: "It stimulates GnRH release from the hypothalamus.",
                    E: "It stimulates the Leydig cells to hypertrophy."
                },
                correctAnswer: "C",
                rationale: "In the hypothalamic-pituitary-testicular axis, testosterone produced by the Leydig cells (or taken exogenously) exerts strong negative feedback directly on the hypothalamus and the anterior pituitary, predominantly inhibiting the release of Luteinizing Hormone (LH).",
                source: "Male Reproductive Disorders PDF, slide 10: 'Hypothalamic-Pituitary-Testicular Axis... Leydig cells-Testosterone: inhibits LH predominantly at HYPO & PIT'"
            },
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO3: Diagram the hypothalamic-pituitary-testicular axis.",
                question: "A 30-year-old man presents with infertility. Blood tests reveal a highly elevated Follicle-Stimulating Hormone (FSH) level, but entirely normal levels of Luteinizing Hormone (LH) and testosterone. A highly specific defect in the Sertoli cells is suspected. This patient's isolated elevation in FSH is most likely due to a failure of the Sertoli cells to secrete which of the following hormones?",
                options: {
                    A: "Androstenedione",
                    B: "Dihydrotestosterone (DHT)",
                    C: "Gonadotropin-releasing hormone (GnRH)",
                    D: "Inhibin B",
                    E: "Pregnenolone"
                },
                correctAnswer: "D",
                rationale: "In the male reproductive axis, Sertoli cells produce Inhibin B, which provides specific negative feedback to the anterior pituitary to halt the secretion of FSH. If Sertoli cells fail to secrete Inhibin B, FSH levels will rise uninhibited, while LH and testosterone (regulated by Leydig cells) remain normal.",
                source: "Male Reproductive Disorders PDF, slide 21: 'Hypothalamic-Pituitary-Testicular Axis... Sertoli Cells—Inhibin B: inhibits FSH'"
            },
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO4: Diagram testosterone levels during the different stages of male development and aging.",
                question: "A researcher is plotting the average plasma testosterone levels of a healthy human male across his entire lifespan, from conception to old age. According to the standard physiological timeline, the very first massive peak in plasma testosterone occurs during which of the following stages of life?",
                options: {
                    A: "At the exact moment of birth",
                    B: "During the first year of neonatal life",
                    C: "During the second trimester of fetal gestation",
                    D: "During the onset of puberty (age 12)",
                    E: "During early adulthood (age 25)"
                },
                correctAnswer: "C",
                rationale: "The plasma testosterone curve shows three distinct spikes in a male's lifetime. The very first peak occurs in utero, predominantly during the 2nd trimester of fetal gestation, to drive sexual differentiation. It spikes again briefly in the neonatal period, and then rises dramatically and permanently at puberty.",
                source: "Male Reproductive Disorders PDF, slide 17: 'Stages of Male Sexual Function: Plasma Testosterone & Sperm Production [Graph shows the first peak occurring between the 1st and 3rd trimester, peaking in the 2nd trimester of fetal gestation]'"
            },
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO4: Diagram testosterone levels during the different stages of male development and aging.",
                question: "A 78-year-old man visits his primary care physician for an annual physical. The physician notes that the patient's serum testosterone level has decreased gradually over the past decade. Along with this drop in testosterone associated with aging, an evaluation of his gonadotropins will most typically reveal which of the following?",
                options: {
                    A: "An isolated, profound decrease in FSH",
                    B: "FSH and LH that tend to remain normal",
                    C: "Total suppression of LH to undetectable levels",
                    D: "Undetectable GnRH levels",
                    E: "Uniformly elevated FSH and LH indicative of complete testicular failure"
                },
                correctAnswer: "B",
                rationale: "As men age, testosterone gradually decreases. However, unlike women undergoing menopause (who experience massive spikes in gonadotropins due to total gonadal failure), aging men retain some gonadal function. Therefore, while testosterone drops, FSH and LH tend to remain relatively normal, representing a combination of both hypergonadotropic and hypogonadotropic states.",
                source: "Male Reproductive Disorders PDF, slide 52: 'Testicular Function with Age... -As men age, testosterone decreases gradually and sperm may decrease... -Testosterone may drop, but FSH and LH tend to remain normal'"
            },
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO5: Explain the primary actions of testosterone.",
                question: "A 15-year-old boy experiences a rapid growth spurt during puberty. Over the next two years, he reaches his final adult height, and his long bones cease growing. The cessation of his bone growth is mediated by epiphyseal closure. Which of the following directly promotes this epiphyseal closure at puberty?",
                options: {
                    A: "Conversion of circulating testosterone to estrogen",
                    B: "Direct binding of DHT to bone matrix receptors",
                    C: "Suppression of anterior pituitary growth hormone",
                    D: "Suppression of local nitric oxide release",
                    E: "Upregulation of sex hormone-binding globulin (SHBG)"
                },
                correctAnswer: "A",
                rationale: "At puberty, testosterone drives increased bone growth, bone matrix, and calcium deposition. However, the ultimate closure of the epiphyseal plates, which ends long bone growth, occurs only after testosterone is converted to estrogen.",
                source: "Male Reproductive Disorders PDF, slide 16: 'Testosterone Functions at Puberty... -Increased Bone Growth -Increased bone matrix, calcium deposition & promotes epiphyseal closure (after its conversion to estrogen)'"
            },
            {
                section: "Male Reproductive Disorders",
                fullLO: "LO5: Explain the primary actions of testosterone.",
                question: "A 30-year-old man begins injecting unprescribed testosterone in an attempt to improve his athletic performance. Routine labs ordered by his physician several months later is most likely to show an increase in which of the following parameters as a direct physiological action of this hormone?",
                options: {

            {

                    A: "The last 7 days",

                correctAnswer: "D",
                rationale: "When a patient is treated for a chlamydial (or gonococcal) infection, it is recommended that sex partners be referred for testing and preemptive treatment if the last sexual contact occurred within the previous 60 days.",

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');
        const customBuilder = document.getElementById('custom-builder');
        const rootElements = document.documentElement;

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Male Reproductive Disorders")) btnText = "Male Repro Disorders";
                    if (btnText.includes("Puberty")) btnText = "Puberty";
                    if (btnText.includes("Sexually Transmitted Diseases")) btnText = "STDs";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
            
            const loBox = document.getElementById(`lo-${index}`);
            loBox.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
